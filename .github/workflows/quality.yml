# Quality gate for dsh-dbhub-live.
#
# The desensitization gate (scripts/desensitize-check.mjs) is the important one:
# every file in this repository ships publicly (npm tarball + public repo), so
# real hosts, accounts, passwords, database and project names must never enter
# it. The local .env denylist is intentionally absent in CI — that layer is a
# maintainer-local supplement, while the slot registry and the generic backstop
# run everywhere.
#
# Branches: `dev` is the integration branch (every change lands there first and
# is tested from there); `main` is release-only and protected. Both are gated
# here, so the commit a release is merged from already carries a green run.
# `workflow_dispatch` exists so the gate can be re-run by hand.
name: quality

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Desensitization gate (slots + backstop)
        run: npm run check:secrets
      - name: Client layout gate (offline render + interaction)
        run: npm run check:ui
      - name: Unit tests
        run: |
          for f in test/*.test.mjs; do
            echo "== $f"
            node "$f"
          done
